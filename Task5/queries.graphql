# Эквивалент GET /clients/{id}
query GetClient($id: ID!) {
  client(id: $id) {
    id
    name
    age
  }
}

# Эквивалент GET /clients/{id}/documents
query GetClientDocuments($id: ID!) {
  client(id: $id) {
    documents {
      id
      type
      number
      issueDate
      expiryDate
    }
  }
}

# Эквивалент GET /clients/{id}/relatives
query GetClientRelatives($id: ID!) {
  client(id: $id) {
    relatives {
      id
      relationType
      name
      age
    }
  }
}

# Один запрос для сценария, которому одновременно нужны клиент, документы и родственники
query GetClientCard($id: ID!) {
  client(id: $id) {
    id
    name
    age
    documents {
      id
      type
      number
      expiryDate
    }
    relatives {
      id
      relationType
      name
    }
  }
}
